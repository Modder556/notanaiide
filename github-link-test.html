<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tinker — GitHub link test</title>
<style>
  :root { --bg:#14171c; --panel:#1a1e24; --line:#2c333d; --text:#e9e5db; --dim:#8b93a0; --amber:#e8a94b; --ok:#7fb37a; --err:#d9705f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:ui-monospace,Menlo,Consolas,monospace; display:grid; place-items:center; padding:24px; }
  .card { width:100%; max-width:440px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:24px; }
  h1 { font-size:16px; margin:0 0 4px; }
  p.sub { color:var(--dim); font-size:12.5px; margin:0 0 18px; line-height:1.5; }
  label { display:block; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; margin:12px 0 5px; }
  input { width:100%; background:#22272f; border:1px solid var(--line); border-radius:7px;
    padding:9px 10px; color:var(--text); font-family:inherit; font-size:12.5px; }
  button { font-family:inherit; font-size:13px; font-weight:700; border:0; border-radius:7px;
    background:var(--amber); color:#14171c; padding:11px 16px; margin-top:16px; width:100%; cursor:pointer; }
  button:hover { filter:brightness(1.07); }
  .status { margin-top:16px; font-size:12.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); } .status.dim { color:var(--dim); }
  .me { display:flex; align-items:center; gap:12px; margin-top:16px; padding:12px; background:#22272f;
    border:1px solid var(--line); border-radius:9px; }
  .me img { width:44px; height:44px; border-radius:50%; }
  .me b { font-size:14px; } .me small { color:var(--dim); display:block; font-size:11.5px; }
  code { color:var(--amber); }
</style>
</head>
<body>
<div class="card">
  <h1>GitHub link test</h1>
  <p class="sub">Proves the OAuth handshake + Worker exchange work end to end. Fill both fields once (they're remembered), then Link.</p>

  <label>OAuth app Client ID</label>
  <input id="clientId" placeholder="Iv1.xxxxxxxx or Ov23xxxx" spellcheck="false" />

  <label>Worker URL (ends in /exchange)</label>
  <input id="workerUrl" placeholder="https://your-worker.workers.dev/exchange" spellcheck="false" />

  <button id="linkBtn">Link GitHub</button>

  <div id="status" class="status dim">Not linked yet.</div>
  <div id="me"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status"), meEl = $("me");
  function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = "status " + (cls || "dim"); }

  // remember the two config values
  try {
    $("clientId").value = localStorage.getItem("gh_client_id") || "";
    $("workerUrl").value = localStorage.getItem("gh_worker_url") || "";
  } catch (e) {}
  function saveCfg() {
    try {
      localStorage.setItem("gh_client_id", $("clientId").value.trim());
      localStorage.setItem("gh_worker_url", $("workerUrl").value.trim());
    } catch (e) {}
  }

  // this page's own URL is the redirect target (register it as the callback URL)
  var REDIRECT = location.origin + location.pathname;

  function randomState() {
    var a = new Uint8Array(16); crypto.getRandomValues(a);
    return Array.from(a).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }

  $("linkBtn").addEventListener("click", function () {
    var clientId = $("clientId").value.trim();
    if (!clientId) { setStatus("Enter your Client ID first.", "err"); return; }
    saveCfg();
    var state = randomState();
    try { sessionStorage.setItem("gh_oauth_state", state); } catch (e) {}
    var auth = "https://github.com/login/oauth/authorize"
      + "?client_id=" + encodeURIComponent(clientId)
      + "&redirect_uri=" + encodeURIComponent(REDIRECT)
      + "&scope=" + encodeURIComponent("read:user")   // minimal for the test; real Tinker uses public_repo workflow
      + "&state=" + encodeURIComponent(state);
    location.href = auth;
  });

  // handle the callback (?code=...&state=...)
  var params = new URLSearchParams(location.search);
  var code = params.get("code"), returnedState = params.get("state");
  if (params.get("error")) {
    setStatus("GitHub returned an error: " + params.get("error") + "\n" + (params.get("error_description") || ""), "err");
  } else if (code) {
    var saved = null;
    try { saved = sessionStorage.getItem("gh_oauth_state"); } catch (e) {}
    if (!saved || saved !== returnedState) {
      setStatus("State mismatch — aborting for safety (possible CSRF, or you refreshed the callback).", "err");
    } else {
      exchange(code);
    }
    // clean the code out of the URL bar
    history.replaceState({}, document.title, REDIRECT);
  }

  function exchange(code) {
    var workerUrl = $("workerUrl").value.trim();
    if (!workerUrl) { setStatus("Got a code from GitHub, but no Worker URL is set to exchange it.", "err"); return; }
    setStatus("Got the code. Exchanging for a token via your Worker…", "dim");
    fetch(workerUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code, redirect_uri: REDIRECT }),
    })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok || res.j.error) {
        setStatus("Exchange failed: " + (res.j.error || r.status) + "\n" + (res.j.detail || ""), "err");
        return;
      }
      setStatus("Token received ✓  (scope: " + (res.j.scope || "none") + ")\nCalling the GitHub API to confirm it works…", "ok");
      return fetch("https://api.github.com/user", {
        headers: { "Authorization": "Bearer " + res.j.access_token, "Accept": "application/vnd.github+json" },
      }).then(function (r) { return r.json(); }).then(function (user) {
        if (!user || !user.login) { setStatus("Token worked but couldn't read your profile.", "err"); return; }
        setStatus("Everything works. OAuth → Worker → GitHub API all confirmed.", "ok");
        meEl.innerHTML = '<div class="me"><img src="' + user.avatar_url + '" alt=""/>'
          + '<div><b>' + user.login + '</b><small>' + (user.name || "") + " · " + (user.public_repos || 0) + " public repos</small></div></div>";
      });
    })
    .catch(function (e) {
      setStatus("Network error talking to the Worker: " + e + "\nCheck the Worker URL and that ALLOWED_ORIGIN matches this page's origin.", "err");
    });
  }
})();
</script>
</body>
</html>
