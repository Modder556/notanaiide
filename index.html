<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tinker — browser IDE</title>

<!-- IMPORTANT: load xterm + pyodide BEFORE Monaco's AMD loader, otherwise their
     UMD wrappers see define.amd and never set their globals. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.2/full/pyodide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.53.0/min/vs/loader.js"></script>

<style>
  :root {
    --bg:      #14171c;
    --bg-2:    #1a1e24;
    --bg-3:    #21262e;
    --border:  #2b323b;
    --text:    #e6e3da;
    --dim:     #8b93a0;
    --faint:   #5a626d;
    --accent:  #e8a94b;  /* amber — a nod to old CRT phosphor */
    --cyan:    #6fb3c9;
    --danger:  #d9705f;
    --ok:      #7fb37a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- top bar ---------- */
  #topbar {
    display: flex; align-items: center; gap: 16px;
    height: 46px; padding: 0 14px; flex: 0 0 auto;
    background: var(--bg-2); border-bottom: 1px solid var(--border);
  }
  .wordmark {
    font-family: var(--mono); font-weight: 600; letter-spacing: .5px;
    font-size: 15px; display: flex; align-items: center; gap: 2px; user-select: none;
  }
  .wordmark .cursor {
    display: inline-block; width: 8px; height: 15px; margin-left: 3px;
    background: var(--accent); transform: translateY(1px);
  }
  @media (prefers-reduced-motion: no-preference) {
    .wordmark .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  }

  .topbar-spacer { flex: 1; }

  .proj-select {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 8px 5px 11px; font-family: var(--mono); font-size: 12.5px;
  }
  .proj-select label { color: var(--faint); }
  .proj-select select {
    background: transparent; border: 0; color: var(--text);
    font-family: var(--mono); font-size: 12.5px; padding: 0 2px; cursor: pointer;
  }
  .proj-select select:focus { outline: none; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: var(--bg-3); color: var(--text);
    border-radius: 7px; padding: 6px 11px; font-size: 12.5px; cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: #3a424d; background: #262c35; }
  .btn.primary {
    background: var(--accent); color: #14171c; border-color: var(--accent); font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- main split ---------- */
  #main { flex: 1; display: flex; min-height: 0; }

  /* sidebar */
  #sidebar {
    flex: 0 0 210px; display: flex; flex-direction: column;
    background: var(--bg-2); border-right: 1px solid var(--border);
  }
  .side-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; color: var(--faint); font-size: 11px;
    letter-spacing: .8px; text-transform: uppercase; font-family: var(--mono);
  }
  .icon-btn {
    background: transparent; border: 0; color: var(--dim); cursor: pointer;
    font-size: 16px; line-height: 1; padding: 2px 5px; border-radius: 5px;
  }
  .icon-btn:hover { color: var(--text); background: var(--bg-3); }
  #file-list { flex: 1; overflow-y: auto; padding: 2px 6px 10px; }
  .file-row {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 8px; border-radius: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 12.5px; color: var(--dim);
  }
  .file-row:hover { background: var(--bg-3); color: var(--text); }
  .file-row.active { background: #262c35; color: var(--text); }
  .file-row .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .del {
    opacity: 0; border: 0; background: transparent; color: var(--faint);
    cursor: pointer; font-size: 14px; padding: 0 2px; border-radius: 4px;
  }
  .file-row:hover .del { opacity: 1; }
  .file-row .del:hover { color: var(--danger); }
  .dot-ext { width: 6px; height: 6px; border-radius: 2px; flex: 0 0 auto; background: var(--faint); }
  .ext-py  { background: var(--accent); }
  .ext-html{ background: var(--danger); }
  .ext-js  { background: var(--cyan); }
  .ext-css { background: #a888d8; }

  /* editor column */
  #editor-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #tabs {
    display: flex; align-items: stretch; height: 36px; flex: 0 0 auto;
    background: var(--bg-2); border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    font-family: var(--mono); font-size: 12.5px; color: var(--dim);
    border-right: 1px solid var(--border); cursor: pointer; white-space: nowrap;
    background: var(--bg-2);
  }
  .tab.active { background: var(--bg); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab .x { border: 0; background: transparent; color: var(--faint); cursor: pointer; font-size: 14px; border-radius: 4px; padding: 0 2px; }
  .tab .x:hover { color: var(--text); }

  #editor { flex: 1; min-height: 0; }
  #editor.empty { display: grid; place-items: center; color: var(--faint); font-family: var(--mono); font-size: 13px; }
  #fb-note {
    padding: 7px 12px; font-size: 12px; color: var(--accent);
    background: #241f16; border-bottom: 1px solid var(--border);
  }
  #fb-note a { color: var(--cyan); }
  #fb-area {
    width: 100%; height: calc(100% - 32px); border: 0; outline: none; resize: none;
    background: var(--bg); color: var(--text); padding: 10px 12px;
    font-family: var(--mono); font-size: 13.5px; line-height: 21px; tab-size: 4;
  }

  /* horizontal divider */
  #divider {
    height: 6px; flex: 0 0 auto; cursor: row-resize; background: var(--bg);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  #divider:hover { background: var(--bg-3); }

  /* bottom panel */
  #panel { flex: 0 0 240px; display: flex; flex-direction: column; min-height: 90px; background: var(--bg); }
  #panel-tabs {
    display: flex; align-items: center; height: 34px; flex: 0 0 auto;
    background: var(--bg-2); border-bottom: 1px solid var(--border);
  }
  .ptab {
    padding: 0 14px; height: 100%; display: flex; align-items: center;
    font-family: var(--mono); font-size: 12px; color: var(--dim); cursor: pointer;
    border-right: 1px solid var(--border); letter-spacing: .3px;
  }
  .ptab.active { color: var(--text); background: var(--bg); box-shadow: inset 0 -2px 0 var(--accent); }
  .ptab-spacer { flex: 1; }
  .ptab-btn { margin-right: 8px; }

  #panel-body { flex: 1; min-height: 0; position: relative; }
  .pane { position: absolute; inset: 0; display: none; }
  .pane.active { display: block; }

  #console-out {
    height: 100%; overflow-y: auto; padding: 8px 12px; margin: 0;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word; color: var(--text);
  }
  #console-out .err { color: var(--danger); }
  #console-out .muted { color: var(--faint); }
  #term-host { height: 100%; padding: 6px 4px 4px 10px; }
  .xterm { height: 100%; }
  #preview-frame { width: 100%; height: 100%; border: 0; background: #fff; }
  #canvas-host { width: 100%; height: 100%; display: grid; place-items: center; background: #101317; overflow: auto; }
  #turtle-canvas { background: #fff; border-radius: 4px; box-shadow: 0 2px 14px rgba(0,0,0,.35); }

  /* profiles list */
  .modal.wide { width: 520px; }
  .prof-list { max-height: 240px; overflow-y: auto; margin: 4px 0 0; }
  .prof-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; background: var(--bg-3);
  }
  .prof-row .pmeta { flex: 1; min-width: 0; }
  .prof-row .pname { font-family: var(--mono); font-size: 12.5px; }
  .prof-row .pdesc { color: var(--faint); font-size: 11px; font-family: var(--mono); margin-top: 2px; }
  .prof-row .ptag {
    font-size: 10px; font-family: var(--mono); color: var(--faint);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px;
  }
  .modal textarea {
    width: 100%; height: 150px; resize: vertical; background: var(--bg-3);
    border: 1px solid var(--border); border-radius: 7px; padding: 9px 10px;
    color: var(--text); font-family: var(--mono); font-size: 12px; line-height: 1.5;
  }

  /* status bar */
  #statusbar {
    display: flex; align-items: center; gap: 14px; flex: 0 0 auto;
    height: 24px; padding: 0 12px; font-family: var(--mono); font-size: 11.5px;
    background: var(--bg-2); border-top: 1px solid var(--border); color: var(--dim);
  }
  #statusbar .sb-spacer { flex: 1; }
  .sb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; margin-right: 6px; }
  .sb-dot.loading { background: var(--accent); }
  .sb-dot.ready { background: var(--ok); }
  @media (prefers-reduced-motion: no-preference) {
    .sb-dot.loading { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  }
  #save-state.warn { color: var(--accent); }

  /* modal */
  #modal-scrim {
    position: fixed; inset: 0; background: rgba(8,10,13,.62); display: none;
    align-items: center; justify-content: center; z-index: 50;
  }
  #modal-scrim.show { display: flex; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px;
    width: 380px; max-width: calc(100vw - 32px); padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .modal h2 { margin: 0 0 4px; font-size: 15px; font-family: var(--mono); }
  .modal p { margin: 0 0 14px; color: var(--dim); font-size: 12.5px; }
  .modal label { display: block; font-size: 11px; color: var(--faint); font-family: var(--mono); text-transform: uppercase; letter-spacing: .6px; margin: 12px 0 6px; }
  .modal input[type=text] {
    width: 100%; background: var(--bg-3); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 10px; color: var(--text); font-family: var(--mono); font-size: 13px;
  }
  .chips { display: flex; gap: 8px; }
  .chip {
    flex: 1; text-align: center; padding: 9px 6px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-3); font-family: var(--mono); font-size: 12px; color: var(--dim);
  }
  .chip.sel { border-color: var(--accent); color: var(--text); background: #2a2519; }
  .chip small { display: block; color: var(--faint); font-size: 10px; margin-top: 2px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2b323b; border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #3a424d; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="wordmark">tinker<span class="cursor"></span></div>
    <div class="proj-select">
      <label>project</label>
      <select id="proj-picker" title="Switch project"></select>
    </div>
    <button class="btn" id="new-proj-btn">+ New project</button>
    <button class="btn" id="profiles-btn" title="Language profiles">Profiles</button>
    <button class="btn" id="market-btn" title="Profile marketplace">Marketplace</button>
    <button class="btn" id="settings-btn" title="Settings">Settings</button>
    <div class="topbar-spacer"></div>
    <button class="btn" id="account-btn" title="Account">Sign in</button>
    <button class="btn primary" id="run-btn" title="Run (Ctrl/Cmd + Enter)">▶ Run</button>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="side-head">
        <span>Files</span>
        <button class="icon-btn" id="new-file-btn" title="New file">＋</button>
      </div>
      <div id="file-list"></div>
    </div>

    <div id="editor-col">
      <div id="tabs"></div>
      <div id="editor" class="empty">Loading editor…</div>
      <div id="divider"></div>
      <div id="panel">
        <div id="panel-tabs">
          <div class="ptab active" data-pane="console">Console</div>
          <div class="ptab" data-pane="terminal">Terminal</div>
          <div class="ptab" data-pane="preview">Preview</div>
          <div class="ptab" data-pane="canvas">Canvas</div>
          <div class="ptab-spacer"></div>
          <button class="icon-btn ptab-btn" id="clear-console-btn" title="Clear console">⌫</button>
        </div>
        <div id="panel-body">
          <div class="pane active" data-pane="console"><div id="console-out"><span class="muted">Run a Python file to see output here.</span></div></div>
          <div class="pane" data-pane="terminal"><div id="term-host"></div></div>
          <div class="pane" data-pane="preview"><iframe id="preview-frame" sandbox="allow-scripts allow-modals"></iframe></div>
          <div class="pane" data-pane="canvas"><div id="canvas-host"><canvas id="turtle-canvas"></canvas></div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span><span class="sb-dot loading" id="rt-dot"></span><span id="rt-status">starting python…</span></span>
    <span class="sb-spacer"></span>
    <span id="cursor-pos"></span>
    <span id="save-state">—</span>
  </div>
</div>

<div id="modal-scrim"><div class="modal" id="modal-box"></div></div>

<script>
(function () {
  "use strict";

  /* ======================= templates ======================= */
  const T = {};
  T.python =
`# main.py — your Python entry point
# Press Run (Ctrl/Cmd + Enter) or type:  python main.py

def greet(name):
    return f"Hello, {name}!"

def main():
    print(greet("world"))
    for i in range(1, 6):
        print(f"{i} squared is {i * i}")

if __name__ == "__main__":
    main()
`;
  T.webHtml =
`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Web Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>It works.</h1>
    <p>Edit the files on the left, then press Run.</p>
    <button id="tapBtn">Tap me</button>
    <p id="count">0 taps</p>
  </main>
  <script src="script.js"><\/script>
</body>
</html>
`;
  T.webCss =
`:root { color-scheme: dark; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  font-family: system-ui, sans-serif; background: #14171c; color: #e6e3da;
}
h1 { color: #e8a94b; margin-bottom: .3rem; }
button {
  font: inherit; padding: .55rem 1.1rem; border: 0; border-radius: 8px;
  background: #e8a94b; color: #14171c; cursor: pointer;
}
button:hover { filter: brightness(1.08); }
`;
  T.webJs =
`let taps = 0;
const btn = document.getElementById("tapBtn");
const count = document.getElementById("count");
btn.addEventListener("click", () => {
  taps += 1;
  count.textContent = taps + (taps === 1 ? " tap" : " taps");
});
`;
  T.turtle =
`# Turtle graphics — draws to the Canvas panel.
# Press Run (Ctrl/Cmd + Enter).
from turtle import *

pensize(2)
colors = ["#e8a94b", "#6fb3c9", "#d9705f", "#a888d8", "#7fb37a"]

for i in range(60):
    pencolor(colors[i % len(colors)])
    forward(i * 4)
    right(59)

hideturtle()
done()
`;

  /* ======================= language profiles =======================
     A profile is data, not code. Anything the IDE knows about a language
     lives in one YAML document, so adding a language = adding a file.   */

  const BUILTIN_PROFILE_YAML = [
`id: python
name: Python
icon: "\u25CF"
color: "#e8a94b"
extensions:
  .py: python
run:
  strategy: pyodide
  entry: main.py
files:
  main.py: |
__PY_TEMPLATE__
`,
`id: web
name: Web
icon: "\u25C6"
color: "#d9705f"
extensions:
  .html: html
  .css: css
  .js: javascript
run:
  strategy: preview
  entry: index.html
files:
  index.html: |
__WEB_HTML__
  style.css: |
__WEB_CSS__
  script.js: |
__WEB_JS__
`,
`id: turtle
name: Turtle
icon: "\u25B2"
color: "#7fb37a"
extensions:
  .py: python
run:
  strategy: pyodide
  entry: main.py
files:
  main.py: |
__TURTLE_TEMPLATE__
`,
`id: blank
name: Blank
icon: "\u25CB"
color: "#8b93a0"
extensions:
  .py: python
  .txt: plaintext
  .md: markdown
run:
  strategy: pyodide
  entry: main.py
files:
  main.py: |
__BLANK_TEMPLATE__
`
  ];

  // YAML block scalars need every line indented; keep templates readable above.
  function indentBlock(s, pad) {
    return s.replace(/\n$/, "").split("\n").map((l) => pad + l).join("\n");
  }
  function hydrate(yamlSrc) {
    return yamlSrc
      .replace("__PY_TEMPLATE__", indentBlock(T.python, "    "))
      .replace("__WEB_HTML__", indentBlock(T.webHtml, "    "))
      .replace("__WEB_CSS__", indentBlock(T.webCss, "    "))
      .replace("__WEB_JS__", indentBlock(T.webJs, "    "))
      .replace("__TURTLE_TEMPLATE__", indentBlock(T.turtle, "    "))
      .replace("__BLANK_TEMPLATE__", indentBlock("# start here\n", "    "));
  }

  const profiles = {};   // id -> profile object
  let customProfileYaml = {};  // id -> raw yaml (persisted, user-installed)

  function parseProfile(yamlSrc) {
    if (typeof jsyaml === "undefined") throw new Error("YAML parser didn't load.");
    const p = jsyaml.load(yamlSrc);
    if (!p || typeof p !== "object") throw new Error("Profile is empty.");
    if (!p.id) throw new Error("Profile needs an 'id'.");
    if (!p.name) p.name = p.id;
    if (!p.extensions || typeof p.extensions !== "object") throw new Error("Profile needs an 'extensions' map, e.g. '.py: python'.");
    if (!p.run || !p.run.strategy) throw new Error("Profile needs 'run.strategy' (pyodide, preview, turtle, or none).");
    const known = ["pyodide", "preview", "turtle", "none"];
    if (known.indexOf(p.run.strategy) < 0) {
      throw new Error("Unknown run strategy '" + p.run.strategy + "'. Supported: " + known.join(", ") + ".");
    }
    if (!p.files || !Object.keys(p.files).length) p.files = { "main.txt": "" };
    return p;
  }
  function registerProfile(p, isCustom, rawYaml) {
    p.custom = !!isCustom;
    profiles[p.id] = p;
    if (isCustom && rawYaml) customProfileYaml[p.id] = rawYaml;
  }
  function loadBuiltinProfiles() {
    BUILTIN_PROFILE_YAML.forEach((src) => {
      try { registerProfile(parseProfile(hydrate(src)), false); }
      catch (e) { console.error("built-in profile failed to parse", e); }
    });
  }
  function profileOf(proj) {
    const p = proj && proj.profile ? profiles[proj.profile] : null;
    return p || profiles.blank || profiles.python;
  }
  function templateFiles(profileId) {
    const p = profiles[profileId];
    if (!p) return { "main.py": "# start here\n" };
    const out = {};
    Object.keys(p.files).forEach((k) => { out[k] = String(p.files[k] == null ? "" : p.files[k]); });
    return out;
  }

  /* ======================= turtle (browser port) =======================
     Stock turtle draws into a Tk window, which doesn't exist here. This is a
     drop-in module that records drawing ops and paints them to a canvas.     */
  const TURTLE_PY = String.raw`
import math, json, js

_ops = []
_bg = "#ffffff"
_W, _H = 640, 480

def _emit(op): _ops.append(op)

class Turtle(object):
    def __init__(self):
        self._x = 0.0; self._y = 0.0; self._h = 0.0
        self._down = True; self._w = 1.0
        self._pc = "#000000"; self._fc = "#000000"
        self._visible = True
        self._filling = False; self._fillpts = None; self._fillmark = 0

    # --- movement ---
    def _goto(self, x, y, draw=True):
        if self._down and draw:
            _emit({"t":"line","x1":self._x,"y1":self._y,"x2":x,"y2":y,"c":self._pc,"w":self._w})
        self._x = float(x); self._y = float(y)
        if self._filling: self._fillpts.append([self._x, self._y])

    def forward(self, d):
        r = math.radians(self._h)
        self._goto(self._x + d * math.cos(r), self._y + d * math.sin(r))

      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);

  /* ======================= console / output routing ======================= */
  function appendConsole(text, isErr) {
    const out = $("console-out");
    const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 30;
    if (isErr) { const s = document.createElement("span"); s.className = "err"; s.textContent = text; out.appendChild(s); }
    else out.appendChild(document.createTextNode(text));
    if (atBottom) out.scrollTop = out.scrollHeight;
  }
  function clearConsole() { $("console-out").innerHTML = ""; }
  function flashConsole(text, isErr) { showPane("console"); appendConsole(text + "\n", isErr); }

  function writeOut(s) {
    if (outTarget === "terminal") term.write(s.replace(/\n/g, "\r\n"));
    else appendConsole(s, false);
  }
  function writeErr(s) {
    if (outTarget === "terminal") term.write("\x1b[38;2;217;112;95m" + s.replace(/\n/g, "\r\n") + "\x1b[0m");
    else appendConsole(s, true);
  }

  /* ======================= Pyodide ======================= */
  function ensurePyodide() {
    if (pyReady) return Promise.resolve();
    if (!pyPromise) pyPromise = initPyodide();
    return pyPromise;
  }
  async function initPyodide() {
    setRuntime("starting python…", "loading");
    if (typeof loadPyodide !== "function") { setRuntime("python unavailable", ""); throw new Error("Pyodide runtime failed to load"); }
    pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v314.0.2/full/" });
    pyodide.setStdout({ batched: (s) => writeOut(s + "\n") });
    pyodide.setStderr({ batched: (s) => writeErr(s + "\n") });
    pyReady = true;
    let ver = "3";
    try { ver = pyodide.runPython("import sys; '.'.join(map(str, sys.version_info[:3]))"); } catch (e) {}
    setRuntime("python " + ver + " · ready", "ready");
    return pyodide;
  }
  function setRuntime(text, cls) {
    $("rt-status").textContent = text;
    const dot = $("rt-dot"); dot.className = "sb-dot" + (cls ? " " + cls : "");
  }

  const RUN_WRAPPER =
`import sys, os, traceback
os.chdir('/project')
__f = __run_target__
sys.argv = [__f]
try:
    with open(__f, 'r') as _fh:
        _src = _fh.read()
    _code = compile(_src, __f, 'exec')
    exec(_code, {'__name__': '__main__', '__file__': __f})
except SystemExit:
    pass
except Exception:
    traceback.print_exc()
`;

  function syncProjectToFS() {
    const files = activeProject().files;
    try { pyodide.FS.mkdir("/project"); } catch (e) {}
    // remove stale files so deleted modules don't linger
    let existing = [];
    try { existing = pyodide.FS.readdir("/project").filter((n) => n !== "." && n !== ".."); } catch (e) {}
    existing.forEach((n) => { if (!(n in files)) { try { pyodide.FS.unlink("/project/" + n); } catch (e) {} } });
    Object.keys(files).forEach((name) => {
      if (/[\\/]/.test(name)) return; // flat only in v1
      try { pyodide.FS.writeFile("/project/" + name, new TextEncoder().encode(files[name])); } catch (e) {}
    });
  }

  async function runPythonFile(path, target, turtleMode) {
    outTarget = target;
    if (!(path in activeProject().files)) { writeErr("No such file: " + path + "\n"); return; }
    if (!pyReady) {
      (target === "terminal" ? termNote : (m) => appendConsole(m + "\n", false))("Loading Python runtime… (first run downloads a few MB)");
      try { await ensurePyodide(); }
      catch (e) {
        const emit = (target === "terminal") ? (m) => termPrint(m, "err") : (m) => appendConsole(m + "\n", true);
        emit("Couldn't load the Python runtime — the sandbox likely blocked the download. Deploy to GitHub Pages (or open the file locally) and it'll work.");
        return;
      }
      outTarget = target;
    }
    syncProjectToFS();
    if (turtleMode) { try { installTurtleModule(); } catch (e) { writeErr("Couldn't install turtle module: " + e + "\n"); } }
    pyodide.globals.set("__run_target__", path);
    try { await pyodide.runPythonAsync(RUN_WRAPPER); }
    catch (e) { writeErr(String((e && e.message) || e) + "\n"); }
    if (turtleMode) {
      // paint whatever was drawn, even if the script never called done()
      try { await pyodide.runPythonAsync("import sys\nif 'turtle' in sys.modules: sys.modules['turtle']._flush()"); }
      catch (e) { /* nothing drawn */ }
    }
    try { pyodide.globals.delete("__run_target__"); } catch (e) {}
  }

  async function pipInstall(pkgs) {
    await ensurePyodide();
    if (!micropipLoaded) { termNote("Loading micropip…"); await pyodide.loadPackage("micropip"); micropipLoaded = true; }
    for (const p of pkgs) {
      termPrint("Collecting " + p + "…", "muted");
      try {
        await pyodide.runPythonAsync("import micropip\nawait micropip.install(" + JSON.stringify(p) + ")");
        termPrint("Successfully installed " + p, "ok");
      } catch (e) {
        const msg = String((e && e.message) || e).split("\n").slice(-6).join("\n");
        termPrint("ERROR: couldn't install " + p, "err");
        termPrint(msg + "\n(not every PyPI package has a WebAssembly build)", "muted");
      }
    }
  }

  /* ======================= run targets ======================= */
  // Turtle is built in: any project that imports it draws to the Canvas panel.
  const TURTLE_RE = /^[ \t]*(?:from[ \t]+turtle[ \t]+import|import[ \t]+turtle)\b/m;
  function usesTurtle(proj) {
    return Object.keys(proj.files).some((n) => extOf(n) === "py" && TURTLE_RE.test(proj.files[n] || ""));
  }
  function runnableFiles(proj) {
    const prof = profileOf(proj);
    const strategy = (prof.run && prof.run.strategy) || "none";
    const want = strategy === "preview" ? "html" : "py";
    return Object.keys(proj.files).filter((n) => extOf(n) === want).sort();
  }

  function runActive() {
    const proj = activeProject();
    const prof = profileOf(proj);
    const strategy = (prof.run && prof.run.strategy) || "none";
    if (strategy === "none") { flashConsole("This profile has no run strategy — edit it in Profiles to add one.", false); return; }

    const cands = runnableFiles(proj);
    if (!cands.length) {
      flashConsole("Nothing runnable here — this project has no " + (strategy === "preview" ? ".html" : ".py") + " file.", false);
      return;

    const remembered = proj.mainFile && cands.indexOf(proj.mainFile) >= 0 ? proj.mainFile : null;
    if (!settings.alwaysAsk && remembered) { execute(remembered); return; }
    if (!settings.alwaysAsk && cands.length === 1) { proj.mainFile = cands[0]; scheduleSave(); execute(cands[0]); return; }

  function buildPreview(entry) {
    const files = activeProject().files;

  /* ======================= terminal ======================= */
  let term, fit, buf = "", hist = [], histIdx = 0, busy = false;
  const PROMPT = "\x1b[38;2;232;169;75mtinker\x1b[0m:\x1b[38;2;111;179;201m~\x1b[0m$ ";
  function writePrompt() { term.write(PROMPT); }
  function termPrint(text, kind) {
    let c = "";
    if (kind === "err") c = "\x1b[38;2;217;112;95m";
    else if (kind === "ok") c = "\x1b[38;2;127;179;122m";
    else if (kind === "muted") c = "\x1b[38;2;122;130;144m";
    term.write(c + String(text).replace(/\n/g, "\r\n") + (c ? "\x1b[0m" : "") + "\r\n");
  }
  function termNote(text) { termPrint(text, "muted"); }

  function initTerminal() {
    term = new Terminal({
      fontFamily: "ui-monospace, 'SF Mono', Menlo, Consolas, monospace",
      fontSize: 13, lineHeight: 1.2, cursorBlink: true, convertEol: false,
      theme: {
        background: "#14171c", foreground: "#e6e3da", cursor: "#e8a94b",
        selectionBackground: "#2b3540", black: "#14171c", brightBlack: "#5a626d",
        white: "#e6e3da", brightWhite: "#ffffff"
      }
    });
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open($("term-host"));
    setTimeout(() => { try { fit.fit(); } catch (e) {} }, 0);

    term.write("\x1b[38;2;122;130;144mTinker terminal — type \x1b[0mhelp\x1b[38;2;122;130;144m for commands.\x1b[0m\r\n" + PROMPT);

    term.onData(onTermData);
  }

  async function onTermData(d) {
    if (busy) return;
    const code = d.charCodeAt(0);
    if (d === "\r") {                               // Enter
      const line = buf; buf = "";
      term.write("\r\n");
      if (line.trim()) { hist.push(line); }
      histIdx = hist.length;
      busy = true;
      try { await runCommand(line); }
      catch (e) { termPrint(String((e && e.message) || e), "err"); }
      busy = false;
      writePrompt();
      return;
    }
    if (d === "\u007f") {                            // Backspace
      if (buf.length) { buf = buf.slice(0, -1); term.write("\b \b"); }
      return;
    }
    if (d === "\u0003") {                            // Ctrl-C
      term.write("^C\r\n"); buf = ""; writePrompt(); return;
    }
    if (d === "\u001b[A" || d === "\u001b[B") {      // history up/down
      if (!hist.length) return;
      histIdx += (d === "\u001b[A") ? -1 : 1;
      histIdx = Math.max(0, Math.min(hist.length, histIdx));
      const repl = hist[histIdx] || "";
      for (let i = 0; i < buf.length; i++) term.write("\b \b");
      buf = repl; term.write(repl);
      return;
    }
    if (code < 32) return;                           // ignore other control seqs
    buf += d; term.write(d);                         // printable (incl. pasted runs)
  }

  async function runCommand(line) {
    const parts = line.trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return;
    const cmd = parts[0], args = parts.slice(1);
    const files = activeProject().files;
    switch (cmd) {
      case "help":
        termPrint(
          "commands:\n" +
          "  python <file>      run a Python file\n" +
          "  pip install <pkg>  install a package (micropip / Pyodide)\n" +
          "  ls                 list files in this project\n" +
          "  cat <file>         print a file\n" +
          "  echo <text>        print text\n" +
          "  clear              clear the terminal\n" +
          "  help               show this help", "muted");
        break;
      case "clear": term.clear(); break;
      case "ls": {
        const names = Object.keys(files).sort();
        termPrint(names.join("  ") || "(empty)");
        break;
      }
      case "pwd": termPrint("/project"); break;
      case "echo": termPrint(args.join(" ")); break;
      case "cat":
        if (!args[0]) { termPrint("usage: cat <file>", "muted"); break; }
        if (args[0] in files) termPrint(files[args[0]]);
        else termPrint("cat: " + args[0] + ": no such file", "err");
        break;
      case "python": case "python3":
        if (!args[0]) { termPrint("usage: python <file>", "muted"); break; }
        outTarget = "terminal";
        if (usesTurtle(activeProject())) {
          termPrint("turtle detected — drawing to the Canvas panel", "muted");
          await runPythonFile(args[0], "terminal", true);
          showPane("canvas");
        } else {
          await runPythonFile(args[0], "terminal", false);
        }
        break;
      case "pip": case "pip3":
        if (args[0] === "install" && args[1]) { outTarget = "terminal"; await pipInstall(args.slice(1)); }
        else termPrint("usage: pip install <package>", "muted");
        break;
      default:
        termPrint(cmd + ": command not found  (try: help)", "err");
    }
  }

  function supaUrl() { return (settings.supaUrl || SUPA_URL_DEFAULT).trim(); }
  function supaKey() { return (settings.supaKey || SUPA_KEY_DEFAULT).trim(); }

  function initCloud() {
    if (typeof window.supabase === "undefined" || !window.supabase.createClient) return;
    if (!supaUrl() || !supaKey()) return;
    try { sb = window.supabase.createClient(supaUrl(), supaKey()); }
    catch (e) { console.error("supabase init failed", e); return; }
    sb.auth.getSession().then(({ data }) => setUser(data && data.session ? data.session.user : null))
      .catch(() => {});
    sb.auth.onAuthStateChange((_evt, session) => setUser(session ? session.user : null));
  }

  function setUser(u) {
    const was = user && user.id;
    user = u;
    const btn = $("account-btn");
    if (btn) btn.textContent = u ? (u.email || "account").split("@")[0] : "Sign in";
    if (u && u.id !== was) onSignedIn();
  }

  async function onSignedIn() {
    try {
      const { data, error } = await sb.from("workspaces").select("data").eq("user_id", user.id).maybeSingle();
      if (error) throw error;
      if (data && data.data && data.data.projects && Object.keys(data.data.projects).length) {
        askCloudMerge(data.data);
      } else {
        pushCloud();
      }
    } catch (e) { console.warn("cloud pull failed", e); }
  }

  function askCloudMerge(cloud) {
    const cloudNames = Object.keys(cloud.projects);
    const localNames = Object.keys(ws.projects);
    openModal(
      "You have projects in the cloud",
      "Pick which set to keep. The other is replaced, so choose carefully.",
      '<div class="chips" id="cm-chips" style="flex-wrap:wrap">' +
        '<div class="chip sel" data-c="cloud">Use cloud<small>' + cloudNames.length + ' project(s)</small></div>' +
        '<div class="chip" data-c="local">Keep this device<small>' + localNames.length + ' project(s)</small></div>' +
      '</div>' +
      '<p style="margin:12px 0 0;font-size:11.5px;color:var(--faint)">Cloud: ' + escapeHtml(cloudNames.join(", ")) + '<br>This device: ' + escapeHtml(localNames.join(", ")) + '</p>',
      () => {
        const pick = $("cm-chips").querySelector(".chip.sel").dataset.c;
        if (pick === "cloud") {
          ws.projects = cloud.projects;
          ws.active = cloud.active in cloud.projects ? cloud.active : Object.keys(cloud.projects)[0];
          if (cloud.customProfiles) {
            Object.keys(cloud.customProfiles).forEach((id) => {
              try { registerProfile(parseProfile(cloud.customProfiles[id]), true, cloud.customProfiles[id]); } catch (e) {}
            });
          }
          session.open = {}; session.current = {};
          const first = Object.keys(activeProject().files)[0];
          session.open[ws.active] = first ? [first] : [];
          session.current[ws.active] = first || null;
          renderProjectPicker(); renderSidebar(); renderTabs();
          if (first) openFile(first); else showEditorEmpty();
          doSave();
        } else { pushCloud(); }
        return true;
      },
      () => {
        $("modal-ok").textContent = "Continue";
        const c = $("cm-chips");
        c.querySelectorAll(".chip").forEach((el) => el.addEventListener("click", () => {
          c.querySelectorAll(".chip").forEach((x) => x.classList.remove("sel"));
          el.classList.add("sel");
        }));
      }
    );
  }

  function scheduleCloudPush() {
    if (!sb || !user) return;
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(pushCloud, 2500);
  }
  async function pushCloud() {
    if (!sb || !user) return;
    try {
      const payload = { projects: ws.projects, active: ws.active, customProfiles: customProfileYaml };
      const { error } = await sb.from("workspaces")
        .upsert({ user_id: user.id, data: payload, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
      if (error) throw error;
    } catch (e) { console.warn("cloud push failed", e); }
  }

  /* ---------- account modal ---------- */
  function showAccount() {
    if (!sb) {
      openModal("Accounts unavailable", "The Supabase client didn't load, or no project is configured in Settings.",
        '<p style="font-size:12px;color:var(--dim);margin:0">Check your connection, then reload.</p>',
        () => true, () => { $("modal-ok").textContent = "Close"; });
      return;
    }
    if (user) {
      openModal("Signed in", escapeHtml(user.email || ""),
        '<p style="font-size:12.5px;color:var(--dim);margin:0 0 14px">Your projects and profiles sync to the cloud automatically.</p>' +
        '<button class="btn" id="ac-signout">Sign out</button>' +
        '<button class="btn" id="ac-syncnow" style="margin-left:8px">Sync now</button>',
        () => true,
        () => {
          $("modal-ok").textContent = "Close";
          $("ac-signout").addEventListener("click", async () => { await sb.auth.signOut(); user = null; setUser(null); closeModal(); });
          $("ac-syncnow").addEventListener("click", async () => { await pushCloud(); $("ac-syncnow").textContent = "Synced"; });
        });
      return;
    }
    let mode = "signin";
    openModal(
      "Account", "Sign in to sync your projects and publish profiles.",
      '<div class="chips" id="au-mode">' +
        '<div class="chip sel" data-m="signin">Sign in</div>' +
        '<div class="chip" data-m="signup">Create account</div>' +
      '</div>' +
      '<label>Email</label><input type="text" id="au-email" spellcheck="false" placeholder="you@example.com" />' +
      '<label>Password</label><input type="password" id="au-pass" placeholder="at least 6 characters" />',
      async () => {
        const email = ($("au-email").value || "").trim();
        const pass = $("au-pass").value || "";
        if (!email || !pass) return "Enter an email and password.";
        if (mode === "signup") {
          const { data, error } = await sb.auth.signUp({ email: email, password: pass });
          if (error) return error.message;
          if (!data.session) return "Account created — check your email to confirm, then sign in.";
          return true;
        }
        const { error } = await sb.auth.signInWithPassword({ email: email, password: pass });
        if (error) return error.message;
        return true;
      },
      () => {
        $("modal-ok").textContent = "Go";
        const c = $("au-mode");
        c.querySelectorAll(".chip").forEach((el) => el.addEventListener("click", () => {
          c.querySelectorAll(".chip").forEach((x) => x.classList.remove("sel"));
          el.classList.add("sel"); mode = el.dataset.m;
        }));
        $("au-email").focus();
      }
    );
  }

  /* ---------- marketplace ---------- */
  let mkCache = [];
  function showMarket() {
    openModal(
      "Profile marketplace", "Community language profiles. Anyone can browse; sign in to publish.",
      '<div class="chips" id="mk-tabs" style="margin-bottom:4px">' +
        '<div class="chip sel" data-t="browse">Browse</div>' +
        '<div class="chip" data-t="publish">Publish</div>' +
      '</div>' +
      '<div id="mk-body"><div class="pdesc" style="padding:12px 0;color:var(--faint);font-family:var(--mono);font-size:12px">Loading…</div></div>',
      () => true,
      () => {
        $("modal-box").classList.add("wide");
        $("modal-ok").textContent = "Close";
        const t = $("mk-tabs");
        t.querySelectorAll(".chip").forEach((el) => el.addEventListener("click", () => {
          t.querySelectorAll(".chip").forEach((x) => x.classList.remove("sel"));
          el.classList.add("sel");
          el.dataset.t === "browse" ? renderBrowse() : renderPublish();
        }));
        renderBrowse();
      }
    );
  }

  async function renderBrowse() {
    const body = $("mk-body");
    if (!body) return;
    body.innerHTML = '<input type="text" id="mk-search" placeholder="search profiles…" spellcheck="false" style="width:100%;margin-bottom:10px" />' +
                     '<div class="prof-list" id="mk-list">loading…</div>';
    const list = $("mk-list");
    if (!sb) { list.innerHTML = '<p style="color:var(--faint);font-size:12px">Cloud unavailable — check your connection.</p>'; return; }
    try {
      const { data, error } = await sb.from("marketplace_profiles")
        .select("id,slug,name,description,yaml,author_name,downloads,created_at")
        .order("downloads", { ascending: false }).limit(100);
      if (error) throw error;
      mkCache = data || [];
    } catch (e) {
      list.innerHTML = '<p style="color:var(--danger);font-size:12px">Couldn\'t load: ' + escapeHtml((e && e.message) || e) +
        '<br><span style="color:var(--faint)">If this says the table is missing, run the setup SQL in Supabase first.</span></p>';
      return;
    }
    const draw = (q) => {
      const rows = mkCache.filter((r) => !q ||
        (r.name + " " + (r.description || "") + " " + (r.author_name || "")).toLowerCase().indexOf(q.toLowerCase()) >= 0);
      if (!rows.length) { list.innerHTML = '<p style="color:var(--faint);font-size:12px">Nothing published yet — be the first.</p>'; return; }
      list.innerHTML = rows.map((r) =>
        '<div class="prof-row">' +
          '<div class="pmeta">' +
            '<div class="pname">' + escapeHtml(r.name) + '</div>' +
            '<div class="pdesc">' + escapeHtml(r.description || "no description") + ' · by ' + escapeHtml(r.author_name || "anon") + ' · ' + (r.downloads || 0) + ' installs</div>' +
          '</div>' +
          '<button class="btn" data-install="' + escapeHtml(r.id) + '" style="padding:4px 9px">Install</button>' +
          (user ? '' : '') +
        '</div>').join("");
      list.querySelectorAll("[data-install]").forEach((b) => b.addEventListener("click", async () => {
        const rec = mkCache.filter((x) => x.id === b.dataset.install)[0];
        if (!rec) return;
        try {
          const p = parseProfile(rec.yaml);
          registerProfile(p, true, rec.yaml);
          scheduleSave();
          b.textContent = "Installed"; b.disabled = true;
          try { await sb.rpc("bump_downloads", { p_id: rec.id }); } catch (e) {}
        } catch (e) { b.textContent = "Bad YAML"; }
      }));
    };
    draw("");
    $("mk-search").addEventListener("input", (e) => draw(e.target.value));
  }

  async function renderPublish() {
    const body = $("mk-body");
    if (!body) return;
    if (!user) {
      body.innerHTML = '<p style="font-size:12.5px;color:var(--dim)">Sign in to publish a profile.</p>' +
        '<button class="btn" id="mk-signin">Sign in</button>';
      $("mk-signin").addEventListener("click", () => { closeModal(); showAccount(); });
      return;
    }
    const ids = Object.keys(profiles);
    body.innerHTML =
      '<label>Profile to publish</label>' +
      '<select id="mk-pick" style="width:100%;background:var(--bg-3);border:1px solid var(--border);border-radius:7px;padding:9px 10px;color:var(--text);font-family:var(--mono);font-size:13px">' +
        ids.map((id) => '<option value="' + escapeHtml(id) + '">' + escapeHtml(profiles[id].name) + '</option>').join("") +
      '</select>' +
      '<label>Short description</label>' +
      '<input type="text" id="mk-desc" placeholder="what this profile is for" spellcheck="false" />' +
      '<label>Publish as</label>' +
      '<input type="text" id="mk-author" placeholder="your display name" spellcheck="false" value="' + escapeHtml((user.email || "").split("@")[0]) + '" />' +
      '<div style="margin-top:14px"><button class="btn primary" id="mk-go">Publish</button> <span id="mk-msg" style="font-size:12px;color:var(--dim);margin-left:8px"></span></div>' +
      '<div style="margin-top:18px"><label>Your published profiles</label><div class="prof-list" id="mk-mine">loading…</div></div>';

    $("mk-go").addEventListener("click", async () => {
      const id = $("mk-pick").value;
      const p = profiles[id];
      const msg = $("mk-msg");
      const raw = customProfileYaml[id] || hydrate(BUILTIN_PROFILE_YAML.filter((s) => s.indexOf("id: " + id + "\n") === 0)[0] || "");
      if (!raw) { msg.textContent = "couldn't find that profile's YAML"; return; }
      msg.textContent = "publishing…";
      try {
        const { error } = await sb.from("marketplace_profiles").insert({
          slug: id, name: p.name, description: ($("mk-desc").value || "").trim(),
          yaml: raw, author_id: user.id, author_name: ($("mk-author").value || "anon").trim()
        });
        if (error) throw error;
        msg.textContent = "published";
        loadMine();
      } catch (e) { msg.textContent = (e && e.message) || String(e); }
    });

    async function loadMine() {
      const host = $("mk-mine");
      if (!host) return;
      try {
        const { data, error } = await sb.from("marketplace_profiles")
          .select("id,name,downloads").eq("author_id", user.id).order("created_at", { ascending: false });
        if (error) throw error;
        if (!data.length) { host.innerHTML = '<p style="color:var(--faint);font-size:12px">Nothing published yet.</p>'; return; }
        host.innerHTML = data.map((r) =>
          '<div class="prof-row"><div class="pmeta"><div class="pname">' + escapeHtml(r.name) + '</div>' +
          '<div class="pdesc">' + (r.downloads || 0) + ' installs</div></div>' +
          '<button class="btn" data-unpub="' + escapeHtml(r.id) + '" style="padding:4px 9px">Remove</button></div>').join("");
        host.querySelectorAll("[data-unpub]").forEach((b) => b.addEventListener("click", async () => {
          await sb.from("marketplace_profiles").delete().eq("id", b.dataset.unpub);
          loadMine();
        }));
      } catch (e) { host.innerHTML = '<p style="color:var(--danger);font-size:12px">' + escapeHtml((e && e.message) || e) + '</p>'; }
    }
    loadMine();
  }

  /* ======================= modal ======================= */
  let modalSubmit = null;
  function openModal(title, desc, bodyHtml, onSubmit, afterOpen) {
    modalSubmit = onSubmit;
    $("modal-box").innerHTML =
      "<h2></h2><p></p><div class='mbody'></div>" +
      "<div class='modal-actions'>" +
        "<button class='btn' id='modal-cancel'>Cancel</button>" +
        "<button class='btn primary' id='modal-ok'>Create</button>" +
      "</div>";
    $("modal-box").querySelector("h2").textContent = title;
    $("modal-box").querySelector("p").textContent = desc;
    $("modal-box").querySelector(".mbody").innerHTML = bodyHtml;
    $("modal-box").classList.remove("wide");
    $("modal-scrim").classList.add("show");
    $("modal-cancel").addEventListener("click", closeModal);
    $("modal-ok").addEventListener("click", submitModal);
    $("modal-box").querySelectorAll("input").forEach((inp) =>
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") submitModal(); }));
    if (afterOpen) afterOpen();
  }
  async function submitModal() {
    if (!modalSubmit) return;
    const btn = $("modal-ok");
    if (btn) btn.disabled = true;
    let res;
    try { res = await modalSubmit(); }
    catch (e) { res = String((e && e.message) || e); }
    if (btn) btn.disabled = false;
    if (res === true) closeModal();
    else if (typeof res === "string") {
      let e = $("modal-box").querySelector(".modal-err");
      if (!e) { e = document.createElement("p"); e.className = "modal-err"; e.style.color = "var(--danger)"; e.style.margin = "10px 0 0"; e.style.fontSize = "12px"; $("modal-box").querySelector(".mbody").appendChild(e); }
      e.textContent = res;
    }
  }
  function closeModal() { $("modal-scrim").classList.remove("show"); modalSubmit = null; }

  /* ======================= divider (resize panel) ======================= */
  function initDivider() {
    const div = $("divider"), panel = $("panel");
    let dragging = false;
    div.addEventListener("mousedown", (e) => { dragging = true; e.preventDefault(); document.body.style.userSelect = "none"; });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const main = $("main").getBoundingClientRect();
      let h = main.bottom - e.clientY;
      h = Math.max(90, Math.min(main.height - 120, h));
      panel.style.flexBasis = h + "px";
      try { fit.fit(); } catch (err) {}
    });
    window.addEventListener("mouseup", () => { if (dragging) { dragging = false; document.body.style.userSelect = ""; } });
  }

  /* ======================= wiring + init ======================= */
  function wireEvents() {
    $("run-btn").addEventListener("click", runActive);
    $("new-file-btn").addEventListener("click", newFile);
    $("new-proj-btn").addEventListener("click", newProject);
    $("profiles-btn").addEventListener("click", showProfiles);
    $("settings-btn").addEventListener("click", showSettings);
    $("market-btn").addEventListener("click", showMarket);
    $("account-btn").addEventListener("click", showAccount);
    $("clear-console-btn").addEventListener("click", clearConsole);
    $("proj-picker").addEventListener("change", (e) => switchProject(e.target.value));
    document.querySelectorAll(".ptab").forEach((t) => t.addEventListener("click", () => showPane(t.dataset.pane)));
    $("modal-scrim").addEventListener("mousedown", (e) => { if (e.target === $("modal-scrim")) closeModal(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
      if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); doSave(); }
    });
    window.addEventListener("beforeunload", () => { if (persistOK) doSave(); });
    window.addEventListener("resize", () => {
      try { fit.fit(); } catch (e) {}
      if (lastTurtlePayload) renderTurtle(lastTurtlePayload);
    });
  }

  async function boot() {
    await loadWorkspace();
    renderProjectPicker(); renderSidebar(); renderTabs();
    setSaveState(persistOK ? "saved" : "blocked");
    try { initTerminal(); } catch (e) { console.error("terminal failed to load", e); }
    initDivider();
    wireEvents();
    try { initMonaco(); }
    catch (e) {
      console.error("editor failed to load", e);
      const h = $("editor"); h.classList.remove("empty"); h.textContent = "Editor failed to load — check your connection, or deploy the file.";
    }
    ensurePyodide().catch(() => {});   // warm up Python in the background
    try { initCloud(); } catch (e) { console.error("cloud init failed", e); }
  }
  boot();
})();
</script>
</body>
</html>
